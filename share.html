<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#10251d">
<meta name="robots" content="noindex,nofollow">
<title>Laporan Pekerjaan · Calculator-Taniku</title>
<style>
:root{color-scheme:light;--ink:#17251f;--muted:#718078;--line:#e3eae5;--green:#176b45;--bg:#f4f7f4}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
.wrap{width:min(820px,calc(100% - 28px));margin:24px auto 48px}
header{display:flex;align-items:center;gap:12px;margin-bottom:20px}.mark{width:42px;height:42px;border-radius:13px;background:#143d2c;color:#fff;display:grid;place-items:center;font-size:21px}header strong{display:block;font-size:16px}header small{color:var(--muted);font-size:11px}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px;margin:12px 0;box-shadow:0 7px 25px #173b2408}
.eyebrow{font-size:10px;letter-spacing:1px;font-weight:800;color:var(--green)}h1{font-size:25px;line-height:1.2;margin:7px 0}h2{font-size:16px;margin:0 0 12px}.muted{color:var(--muted);font-size:12px}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin-top:18px}.stat{background:#f2f6f3;border:1px solid var(--line);border-radius:11px;padding:12px}.stat span{display:block;font-size:10px;color:var(--muted)}.stat b{font-size:16px;overflow-wrap:anywhere}
.item{display:flex;justify-content:space-between;gap:12px;padding:13px 0;border-top:1px solid var(--line)}.item:first-of-type{border-top:0}.item strong{display:block;font-size:13px}.item small{display:block;color:var(--muted);font-size:11px;margin-top:3px}.price{font-size:13px;font-weight:800;white-space:nowrap;text-align:right}
.loading,.error{padding:22px;text-align:center;border:1px dashed #d7e0d9;border-radius:12px;color:var(--muted);font-size:13px}.error{color:#9d332b;background:#fff8f7;border-color:#f0d1ce}.error button{margin-top:12px;border:0;border-radius:9px;background:#176b45;color:white;padding:10px 14px;font:inherit}
footer{text-align:center;color:#89948d;font-size:11px;margin-top:20px}
@media(min-width:620px){.stats{grid-template-columns:repeat(3,minmax(0,1fr))}.card{padding:22px}}
</style>
</head>
<body><main class="wrap">
<header><div class="mark">▦</div><div><strong>Calculator-Taniku</strong><small>Laporan pekerjaan sawah · Tautan hanya-baca</small></div></header>
<div id="content" class="card"><div class="loading">Mengambil laporan pekerjaan…</div></div>
<footer>Data ditampilkan dari laporan yang dibagikan pemilik akun.</footer>
</main>
<script>
(()=> {
 const content=document.getElementById('content');
 const token=new URLSearchParams(location.search).get('token')||location.pathname.match(/^\/s\/([A-Za-z0-9_-]{16,128})\/?$/)?.[1];
 const endpoint='https://gevrnbqksgjlvpqjtmtl.supabase.co/rest/v1/rpc/read_work_project_share';
 const key='sb_publishable_xjMpFAk6N34RvbgpP6IrPA_J5RIFcnF';
 const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 const money=v=>new Intl.NumberFormat('id-ID',{style:'currency',currency:'IDR',maximumFractionDigits:0}).format(Number(v)||0);
 const num=v=>new Intl.NumberFormat('id-ID',{maximumFractionDigits:2}).format(Number(v)||0);
 const date=v=>{if(!v)return '—';const d=new Date(v+'T00:00:00');return Number.isNaN(d.getTime())?esc(v):d.toLocaleDateString('id-ID',{day:'2-digit',month:'long',year:'numeric'})};
 function fail(message){content.innerHTML='<div class="error"><strong>Laporan belum dapat dimuat</strong><p>'+esc(message)+'</p><button type="button" onclick="location.reload()">Coba lagi</button></div>'}
 function render(data){
   if(Array.isArray(data))data=data[0];
   if(data?.result)data=data.result;
   if(!data?.project)throw new Error('Tautan tidak valid, sudah kedaluwarsa, atau telah dicabut.');
   const p=data.project,items=(data.items||[]).filter(x=>x.is_active),payments=data.payments||[];
   const total=items.reduce((s,x)=>s+Number(x.expected_amount||0),0),area=items.reduce((s,x)=>s+Number(x.area_m2||0),0),boxes=items.reduce((s,x)=>s+Number(x.kotak_exact||0),0),paid=payments.reduce((s,x)=>s+Number(x.amount_received||0),0);
   content.innerHTML='<div class="eyebrow">LAPORAN PEKERJAAN · HANYA BACA</div><h1>'+esc(p.name||'Pekerjaan sawah')+'</h1><div class="muted">'+esc(p.village_name||'Desa tidak dicantumkan')+' · '+date(p.work_date)+'</div><div class="stats"><div class="stat"><span>Total sawah aktif</span><b>'+items.length+'</b></div><div class="stat"><span>Luas total</span><b>'+num(area)+' m²</b></div><div class="stat"><span>Jumlah kotak</span><b>'+num(boxes)+'</b></div><div class="stat"><span>Estimasi biaya</span><b>'+money(total)+'</b></div><div class="stat"><span>Pembayaran tercatat</span><b>'+money(paid)+'</b></div><div class="stat"><span>Sisa estimasi</span><b>'+money(Math.max(0,total-paid))+'</b></div></div>'+(p.notes?'<p class="muted" style="margin-top:15px">Catatan: '+esc(p.notes)+'</p>':'')+'</div><section class="card"><h2>Rincian sawah</h2>'+(items.length?items.map((x,i)=>'<article class="item"><div><strong>'+(i+1)+'. '+esc(x.field_name||'Sawah tanpa nama')+'</strong><small>Petani: '+esc(x.farmer_name||'—')+' · Desa: '+esc(x.village_name||p.village_name||'—')+'</small><small>Luas: '+num(x.area_m2)+' m² · '+num(x.kotak_exact)+' kotak</small><small>Tarif: '+money(x.tariff_per_kotak)+' / kotak</small></div><div class="price">'+money(x.expected_amount)+'</div></article>').join(''):'<p class="muted">Belum ada sawah aktif dalam pekerjaan ini.</p>')+'</section><p class="muted" style="text-align:center">Akses laporan sampai '+new Date(data.expires_at).toLocaleString('id-ID')+'. Data asli hanya dapat diubah oleh pemilik akun.</p>';
 }
 if(!token){fail('Token tautan tidak ditemukan. Periksa kembali link yang dibagikan.');return}
 fetch(endpoint,{method:'POST',headers:{'Content-Type':'application/json','apikey':key,'Authorization':'Bearer '+key},body:JSON.stringify({p_token:token}),cache:'no-store'})
 .then(async response=>{const raw=await response.text();let data;try{data=raw?JSON.parse(raw):null}catch{throw new Error('Respons server tidak dapat dibaca (HTTP '+response.status+').')}if(!response.ok)throw new Error(data?.message||data?.hint||'Server menolak permintaan (HTTP '+response.status+').');return data})
 .then(render).catch(error=>{console.error('Share report error:',error);fail(error.message||'Periksa koneksi internet, lalu coba lagi.')});
})();
</script></body></html>
