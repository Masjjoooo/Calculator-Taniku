<!doctype html>
<html lang="id"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#10251d"><meta name="robots" content="noindex,nofollow">
<title>Laporan Pekerjaan · Calculator-Taniku</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script defer src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
:root{color-scheme:light;--ink:#17251f;--muted:#718078;--line:#e3eae5;--green:#176b45;--bg:#f4f7f4}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
.wrap{width:min(900px,calc(100% - 28px));margin:24px auto 48px}
header{display:flex;align-items:center;gap:12px;margin-bottom:20px}.mark{width:42px;height:42px;border-radius:13px;background:#143d2c;color:#fff;display:grid;place-items:center;font-size:21px}header strong{display:block;font-size:16px}header small{color:var(--muted);font-size:11px}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px;margin:12px 0;box-shadow:0 7px 25px #173b2408}
.eyebrow{font-size:10px;letter-spacing:1px;font-weight:800;color:var(--green)}h1{font-size:25px;line-height:1.2;margin:7px 0}h2{font-size:16px;margin:0 0 12px}.muted{color:var(--muted);font-size:12px}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin-top:18px}.stat{border:1px solid var(--line);border-radius:11px;padding:12px;min-width:0}.stat span{display:block;font-size:10px;color:var(--muted)}.stat b{font-size:16px;overflow-wrap:anywhere}
.finance{background:#fff7ed;border-color:#fed7aa}.short{background:#fff1f2;border-color:#fecdd3}.over{background:#fdf4ff;border-color:#f5d0fe}.area{background:#eff6ff;border-color:#bfdbfe}.plots{background:#f5f3ff;border-color:#ddd6fe}.paid{background:#ecfdf3;border-color:#bbf7d0}
.map{height:360px;border:1px solid #dce6df;border-radius:13px;overflow:hidden;background:#eaf0eb}.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11px;color:var(--muted);margin:8px 0}.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px}.red{background:#dc2626}.green{background:#16a34a}.gray{background:#9ca3af}
.farmer{border:1px solid var(--line);border-radius:13px;padding:13px;margin:12px 0;background:#fff}.farmer h3{font-size:14px;margin:0 0 7px}.pill{display:inline-block;padding:4px 8px;border-radius:20px;font-size:10px;font-weight:850}.pill.paid{background:#dcfce7;color:#166534}.pill.unpaid{background:#fee2e2;color:#991b1b}
.item{border-top:1px solid var(--line);padding:12px 0}.item:first-of-type{margin-top:7px}.item-head{display:flex;justify-content:space-between;gap:10px}.item-head strong{font-size:13px}.item-head b{font-size:13px;white-space:nowrap}
.details{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px;margin:9px 0}.detail{border:1px solid var(--line);border-radius:9px;padding:9px;min-width:0}.detail span{display:block;font-size:10px;color:var(--muted)}.detail b{display:block;font-size:12px;overflow-wrap:anywhere;margin-top:2px}
.tx{font-size:11px;color:var(--muted);padding:5px 0;border-top:1px dashed var(--line)}
.loading,.error{padding:22px;text-align:center;border:1px dashed #d7e0d9;border-radius:12px;color:var(--muted);font-size:13px}.error{color:#9d332b;background:#fff8f7;border-color:#f0d1ce}.error button{margin-top:12px;border:0;border-radius:9px;background:#176b45;color:white;padding:10px 14px;font:inherit}
footer{text-align:center;color:#89948d;font-size:11px;margin-top:20px}
@media(min-width:620px){.stats{grid-template-columns:repeat(3,minmax(0,1fr))}.card{padding:22px}}
@media(max-width:480px){.map{height:300px}.details{grid-template-columns:1fr 1fr}.item-head{align-items:flex-start}}
</style></head><body><main class="wrap">
<header><div class="mark">▦</div><div><strong>Calculator-Taniku</strong><small>Laporan pekerjaan sawah · Tautan hanya-baca</small></div></header>
<div id="content" class="card"><div class="loading">Mengambil laporan pekerjaan…</div></div>
<footer>Data ditampilkan dari laporan yang dibagikan pemilik akun.</footer>
</main>
<script>
(()=> {
 const content=document.getElementById('content'),pathParts=location.pathname.split('/').filter(Boolean),token=new URLSearchParams(location.search).get('token')||(pathParts[0]==='s'?pathParts[1]:null);
 const endpoint='https://gevrnbqksgjlvpqjtmtl.supabase.co/rest/v1/rpc/read_work_project_share',key='sb_publishable_xjMpFAk6N34RvbgpP6IrPA_J5RIFcnF';
 let map=null;
 const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 const money=v=>new Intl.NumberFormat('id-ID',{style:'currency',currency:'IDR',maximumFractionDigits:0}).format(Number(v)||0);
 const num=v=>new Intl.NumberFormat('id-ID',{maximumFractionDigits:2}).format(Number(v)||0);
 const date=v=>{if(!v)return '—';const d=new Date(v+'T00:00:00');return Number.isNaN(d.getTime())?esc(v):d.toLocaleDateString('id-ID',{day:'2-digit',month:'long',year:'numeric'})};
 function fail(message){content.innerHTML='<div class="error"><strong>Laporan belum dapat dimuat</strong><p>'+esc(message)+'</p><button type="button" onclick="location.reload()">Coba lagi</button></div>'}
 function render(data){
  if(Array.isArray(data))data=data[0];if(data?.result)data=data.result;
  if(!data?.project)throw new Error('Tautan tidak valid, sudah kedaluwarsa, atau telah dicabut.');
  const p=data.project,items=data.items||[],active=items.filter(x=>x.is_active),payments=data.payments||[];
  const direct=item=>payments.filter(x=>x.project_item_id===item.id).reduce((s,x)=>s+Number(x.amount_received||0),0);
  const paidFor=item=>{const directPaid=direct(item);if(!item.farmer_id)return directPaid;const siblings=active.filter(x=>x.farmer_id===item.farmer_id),unallocated=payments.filter(x=>!x.project_item_id&&x.farmer_id===item.farmer_id).reduce((s,x)=>s+Number(x.amount_received||0),0),due=siblings.reduce((s,x)=>s+Number(x.expected_amount||0),0);if(!unallocated||!due)return directPaid;let remaining=unallocated;for(let i=0;i<siblings.length;i++){const x=siblings[i],share=i===siblings.length-1?remaining:Math.floor(unallocated*Number(x.expected_amount||0)/due);remaining-=share;if(x.id===item.id)return directPaid+share}return directPaid};
  const total=active.reduce((s,x)=>s+Number(x.expected_amount||0),0),received=active.reduce((s,x)=>s+paidFor(x),0),shortage=Math.max(0,total-received),surplus=Math.max(0,received-total),areaTotal=active.reduce((s,x)=>s+Number(x.area_m2||0),0),boxesTotal=active.reduce((s,x)=>s+Number(x.kotak_exact||0),0),farmerKeys=[...new Set(items.map(x=>x.farmer_id||x.farmer_name))],paidCount=active.filter(x=>Number(x.expected_amount||0)>0&&paidFor(x)>=Number(x.expected_amount||0)).length;
  content.innerHTML='<div class="eyebrow">LAPORAN PEKERJAAN · HANYA BACA</div><h1>'+esc(p.name||'Pekerjaan sawah')+'</h1><div class="muted">'+esc(p.village_name||'Desa tidak dicantumkan')+' · '+date(p.work_date)+' · '+(p.status==='completed'?'Selesai':'Berjalan')+'</div><div class="stats"><div class="stat plots"><span>Jumlah sawah aktif</span><b>'+active.length+' petak</b></div><div class="stat area"><span>Total luas lahan</span><b>'+num(areaTotal)+' m²</b></div><div class="stat plots"><span>Total petak GPS</span><b>'+num(boxesTotal)+' kotak</b></div><div class="stat finance"><span>Total tagihan</span><b>'+money(total)+'</b></div><div class="stat finance"><span>Total uang diterima</span><b>'+money(received)+'</b></div><div class="stat short"><span>Total kekurangan</span><b>'+money(shortage)+'</b></div><div class="stat over"><span>Total kelebihan</span><b>'+money(surplus)+'</b></div><div class="stat paid"><span>Sawah lunas</span><b>'+paidCount+' petak</b></div><div class="stat short"><span>Sawah belum lunas</span><b>'+(active.length-paidCount)+' petak</b></div></div>'+(p.notes?'<p class="muted" style="margin-top:15px">Catatan: '+esc(p.notes)+'</p>':'')+'<section class="card"><h2>Peta status pembayaran sawah</h2><div class="legend"><span><i class="dot red"></i>Belum lunas / belum dibayar</span><span><i class="dot green"></i>Sudah lunas</span><span><i class="dot gray"></i>Tidak dikerjakan</span></div><div id="shareMap" class="map"><div class="loading">Memuat peta satelit…</div></div><p id="mapNote" class="muted"></p></section><section class="card"><h2>Rincian petani, petak, dan keuangan</h2>'+farmerKeys.map(keyId=>{const rows=items.filter(x=>(x.farmer_id||x.farmer_name)===keyId),first=rows[0],farmerActive=rows.filter(x=>x.is_active),due=farmerActive.reduce((s,x)=>s+Number(x.expected_amount||0),0),paid=farmerActive.reduce((s,x)=>s+paidFor(x),0),short=Math.max(0,due-paid),over=Math.max(0,paid-due),complete=due>0&&paid>=due,tx=payments.filter(x=>x.farmer_id===first.farmer_id);return '<article class="farmer"><h3>'+esc(first.farmer_name||'Petani')+'</h3><span class="pill '+(complete?'paid':'unpaid')+'">'+(complete?'PETANI LUNAS':'PETANI BELUM LUNAS')+'</span><div class="details"><div class="detail finance"><span>Total tagihan</span><b>'+money(due)+'</b></div><div class="detail finance"><span>Uang diterima</span><b>'+money(paid)+'</b></div><div class="detail short"><span>Kekurangan</span><b>'+money(short)+'</b></div><div class="detail over"><span>Kelebihan</span><b>'+money(over)+'</b></div></div>'+rows.map(item=>{const fieldPaid=paidFor(item),fieldDue=Number(item.expected_amount||0),fieldShort=Math.max(0,fieldDue-fieldPaid),fieldOver=Math.max(0,fieldPaid-fieldDue),fieldDone=fieldDue>0&&fieldPaid>=fieldDue;return '<div class="item"><div class="item-head"><strong>'+esc(item.field_name||'Sawah tanpa nama')+'</strong><b>'+money(fieldDue)+'</b></div><div class="muted">'+num(item.area_m2)+' m² · '+num(item.kotak_exact)+' kotak GPS · Tarif '+money(item.tariff_per_kotak)+'/kotak · '+(item.is_active?'Dikerjakan':'Tidak dikerjakan')+'</div><div class="details"><div class="detail area"><span>Luas lahan</span><b>'+num(item.area_m2)+' m²</b></div><div class="detail plots"><span>Jumlah petak</span><b>'+num(item.kotak_exact)+' kotak</b></div><div class="detail finance"><span>Uang diterima</span><b>'+money(fieldPaid)+'</b></div><div class="detail short"><span>Kekurangan</span><b>'+money(fieldShort)+'</b></div><div class="detail over"><span>Kelebihan</span><b>'+money(fieldOver)+'</b></div><div class="detail '+(fieldDone?'paid':'short')+'"><span>Status pembayaran</span><b>'+(fieldDone?'LUNAS':'BELUM LUNAS')+'</b></div></div></div>'}).join('')+(tx.length?'<div class="muted" style="font-weight:750;margin-top:9px">Riwayat uang diterima</div>'+tx.map(t=>'<div class="tx">'+date(t.payment_date)+' · '+money(t.amount_received)+(t.notes?' · '+esc(t.notes):'')+'</div>').join(''):'<div class="muted" style="margin-top:8px">Belum ada transaksi pembayaran.</div>')+'</article>'}).join('')+'</section><p class="muted" style="text-align:center">Akses laporan sampai '+new Date(data.expires_at).toLocaleString('id-ID')+'. Laporan hanya-baca; data asli dikelola pemilik akun.</p>';
  const drawMap=()=>{const el=document.getElementById('shareMap');if(!el)return;if(!window.L){document.getElementById('mapNote').textContent='Pustaka peta belum termuat. Rincian laporan tetap tersedia.';return}try{if(map){map.remove();map=null}map=L.map(el,{zoomControl:true,scrollWheelZoom:false}).setView([-6.75,111.05],15);L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:19,attribution:'Tiles © Esri, Maxar, Earthstar Geographics'}).addTo(map);const group=L.featureGroup().addTo(map);let count=0;items.forEach(item=>{const ring=item.boundary_geojson?.coordinates?.[0];if(!Array.isArray(ring)||ring.length<4)return;const pts=ring.slice(0,-1).map(c=>[Number(c[1]),Number(c[0])]);if(pts.length<3)return;const due=Number(item.expected_amount||0),paid=paidFor(item),complete=item.is_active&&due>0&&paid>=due,status=!item.is_active?'inactive':complete?'paid':'unpaid',color=status==='paid'?'#16a34a':status==='inactive'?'#9ca3af':'#dc2626';L.polygon(pts,{color:'#fff',weight:3,fillColor:color,fillOpacity:.5}).bindTooltip(esc(item.farmer_name||'Petani')+' · '+esc(item.field_name||'Sawah')+' · '+(status==='paid'?'LUNAS':status==='inactive'?'TIDAK DIKERJAKAN':'BELUM LUNAS'),{permanent:true,direction:'center'}).bindPopup('<strong>'+esc(item.farmer_name||'Petani')+'</strong><br>'+esc(item.field_name||'Sawah')+'<br>Luas: '+num(item.area_m2)+' m² · '+num(item.kotak_exact)+' kotak<br>Tagihan: '+money(due)+'<br>Diterima: '+money(paid)+'<br>Kekurangan: '+money(Math.max(0,due-paid))+'<br>Kelebihan: '+money(Math.max(0,paid-due))+'<br><b>'+(status==='paid'?'SUDAH TERBAYAR':status==='inactive'?'TIDAK DIKERJAKAN':'BELUM TERBAYAR')+'</b>').addTo(group);count++});if(count){map.fitBounds(group.getBounds().pad(.15));document.getElementById('mapNote').textContent=count+' polygon ditampilkan. Warna menunjukkan status pembayaran.'}else document.getElementById('mapNote').textContent='Belum ada polygon batas sawah dalam laporan ini.';setTimeout(()=>map?.invalidateSize(),100)}catch(e){document.getElementById('mapNote').textContent='Peta gagal dimuat. Periksa koneksi internet.'}};
  if(window.L)drawMap();else{let tries=0;const timer=setInterval(()=>{if(window.L){clearInterval(timer);drawMap()}else if(++tries>=30){clearInterval(timer);drawMap()}},150)}
 }
 if(!token){fail('Token tautan tidak ditemukan. Periksa kembali link yang dibagikan.');return}
 fetch(endpoint,{method:'POST',headers:{'Content-Type':'application/json','apikey':key,'Authorization':'Bearer '+key},body:JSON.stringify({p_token:token}),cache:'no-store'})
 .then(async response=>{const raw=await response.text();let data;try{data=raw?JSON.parse(raw):null}catch{throw new Error('Respons server tidak dapat dibaca (HTTP '+response.status+').')}if(!response.ok)throw new Error(data?.message||data?.hint||'Server menolak permintaan (HTTP '+response.status+').');return data})
 .then(render).catch(error=>{console.error('Share report error:',error);fail(error.message||'Periksa koneksi internet, lalu coba lagi.')});
})();
</script></body></html>
